name: GLaDOS Daily Checkin

on:
  schedule:
    - cron: '37 16 * * *'          # 每天 UTC 16:37（北京时间次日 0:37）
  workflow_dispatch:             # 支持手动触发

permissions:
  contents: write               # 每月自动保活，避免 GitHub 60 天不活跃停用

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run checkin script
        env:
          GLADOS: ${{ secrets.GLADOS }}
        run: python checkin.py

      # 仅在上次提交超过 30 天时更新一次心跳文件，不影响签到结果
      - name: Keep scheduled workflow active
        if: ${{ always() && github.event_name == 'schedule' }}
        shell: bash
        run: |
          last_commit_ts="$(git log -1 --format=%ct)"
          now_ts="$(date +%s)"
          if (( now_ts - last_commit_ts >= 30 * 86400 )); then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/schedule-heartbeat.txt
            git add .github/schedule-heartbeat.txt
            git commit -m "chore: keep checkin schedule active [skip ci]"
            git push
          else
            echo "Recent repository activity exists; no keepalive commit needed."
          fi
